    <script>
    (function() {
        function fitText() {
            var main   = document.querySelector('.splash-text-main');
            var top    = document.querySelector('.splash-text-top');
            var bottom = document.querySelector('.splash-text-bottom');
            if (!main || !top || !bottom) return;

            // Сбросить letter-spacing перед измерением
            top.style.letterSpacing    = '0px';
            bottom.style.letterSpacing = '0px';
            main.style.letterSpacing   = '2px';

            // Принудительный reflow
            main.offsetWidth;

            // Ширина YUNUSOBOD — эталон
            var targetW = main.scrollWidth;
            var topW    = top.scrollWidth;
            var botW    = bottom.scrollWidth;

            // letter-spacing = (нужная ширина - текущая) / кол-во символов
            if (topW < targetW) {
                var topGaps = top.textContent.trim().length;
                top.style.letterSpacing = ((targetW - topW) / topGaps).toFixed(2) + 'px';
            }
            if (botW < targetW) {
                var botGaps = bottom.textContent.trim().length;
                bottom.style.letterSpacing = ((targetW - botW) / botGaps).toFixed(2) + 'px';
            }
        }

        setTimeout(fitText, 0);
        setTimeout(fitText, 150);
        window.addEventListener('load', fitText);
        window.addEventListener('resize', fitText);

        var splash = document.getElementById('splash-screen');
        if (location.hash) {
            // Переход к конкретному разделу (с другой страницы или из меню) —
            // заставка не нужна, сразу показываем контент.
            splash.remove();
        } else {
            setTimeout(function() {
                splash.classList.add('hide');
                setTimeout(function() { splash.remove(); }, 800);
            }, 3200);
        }
    })();
    </script>

    <script>
    // ===== ЗАПИСЬ НА КРУЖОК =====
    let _enrollCircle = '';

    window.openEnroll = function(idx) {
        const circle = window._circlesData && window._circlesData[idx];
        const circleName = circle ? window.tData(circle.title) : '';
        _enrollCircle = circleName;
        document.getElementById('enroll-title').textContent        = window.t('enroll.title');
        document.getElementById('enroll-circle-label').innerHTML =
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:4px;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
            window.escapeHtml(circleName);
        document.getElementById('enroll-label-name').textContent   = window.t('enroll.name');
        document.getElementById('enroll-label-phone').textContent  = window.t('enroll.phone');
        document.getElementById('enroll-label-child').textContent  = window.t('enroll.child');
        document.getElementById('enroll-name').placeholder         = window.t('enroll.namePh');
        document.getElementById('enroll-child').placeholder        = window.t('enroll.childPh');
        document.getElementById('enroll-submit-btn').textContent   = window.t('enroll.submit');
        document.getElementById('enroll-success-title').textContent = window.t('enroll.successTitle');
        document.getElementById('enroll-success-text').textContent  = window.t('enroll.successText');
        document.getElementById('enroll-name').value = '';
        document.getElementById('enroll-phone').value = '';
        document.getElementById('enroll-child').value = '';
        document.getElementById('enroll-error').style.display = 'none';
        document.getElementById('enroll-form-body').style.display = '';
        document.getElementById('enroll-success').style.display = 'none';
        document.getElementById('enroll-submit-btn').disabled = false;
        document.getElementById('enroll-modal').classList.add('open');
    };

    window.closeEnroll = function() {
        document.getElementById('enroll-modal').classList.remove('open');
    };

    window.submitEnroll = async function() {
        const name  = document.getElementById('enroll-name').value.trim();
        const phone = document.getElementById('enroll-phone').value.trim();
        const child = document.getElementById('enroll-child').value.trim();
        const err   = document.getElementById('enroll-error');

        if (!name || !phone) {
            err.textContent = window.t('enroll.errorRequired');
            err.style.display = 'block';
            return;
        }
        err.style.display = 'none';

        const btn = document.getElementById('enroll-submit-btn');
        btn.disabled = true;
        btn.textContent = window.t('enroll.sending');

        const message = `${window.t('enroll.circleLabel')}: ${_enrollCircle}` + (child ? `\n${window.t('enroll.childLabel')}: ${child}` : '');
        try {
            const r = await fetch('/api/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone, message, topic: 'circle' })
            });
            if (r.ok) {
                document.getElementById('enroll-form-body').style.display = 'none';
                document.getElementById('enroll-success').style.display = 'block';
                setTimeout(window.closeEnroll, 3000);
            } else {
                err.textContent = window.t('enroll.errorSend');
                err.style.display = 'block';
                btn.disabled = false;
                btn.textContent = window.t('enroll.submit');
            }
        } catch {
            err.textContent = window.t('enroll.noConn');
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = window.t('enroll.submit');
        }
    };

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') window.closeEnroll();
    });
    </script>
